apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "demands.fullname" . }}-postgres
  labels:
    app: postgres
    {{- include "demands.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "demands.fullname" . }}-postgres
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "demands.fullname" . }}-secrets
                  key: postgres-password
            - name: POSTGRES_MULTIPLE_DATABASES
              value: {{ .Values.postgres.databases | quote }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user }}
                - -d
                - demands
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.user }}
                - -d
                - demands
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "demands.fullname" . }}-postgres-pvc
        - name: init-scripts
          configMap:
            name: {{ include "demands.fullname" . }}-postgres-init
            defaultMode: 0755
