openapi: 3.0.3
info:
  title: Resource Demand Management System API
  description: API for managing infrastructure resource demands. Replaces Excel-based process for requesting CPU, RAM, and other infrastructure resources.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Root
    description: Health and info endpoints
  - name: Auth
    description: Authentication and user identity
  - name: Users & Groups
    description: User and group search
  - name: Centers
    description: Organization center management
  - name: Branches
    description: Organization branch management
  - name: Sections
    description: Organization section management
  - name: Bases
    description: Location base management
  - name: Environments
    description: Location environment management
  - name: Networks
    description: Location network management
  - name: Locations
    description: Composite location management (Base + Environment + Network)
  - name: Services
    description: Service management
  - name: Resources
    description: Service resource management
  - name: Capacities
    description: Resource capacity management
  - name: Projects
    description: Project/demand group management
  - name: Demands
    description: Individual resource demand management
  - name: Decision Reasons
    description: Reasons for demand decisions

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from POST /api/auth/token

  schemas:
    # ---- Common ----
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ---- Enums ----
    ProjectType:
      type: string
      enum:
        - Emergency
        - Semiannual

    ProjectKind:
      type: string
      enum:
        - App
        - Track

    Median:
      type: string
      enum:
        - H1
        - H2

    DemandType:
      type: string
      enum:
        - New
        - Extension

    DemandStatus:
      type: string
      enum:
        - Pending
        - Approved
        - Rejected
        - PartiallyApproved

    # ---- Auth ----
    UserProfile:
      type: object
      properties:
        sub:
          type: string
        email:
          type: string
        username:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string

    OAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
        scope:
          type: string

    AuthHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - error
        oidc:
          type: string
        authClient:
          type: string
        oidcError:
          type: string
        authClientError:
          type: string

    UsersGroupsResult:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
        groups:
          type: array
          items:
            type: object

    # ---- Organization ----
    Center:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name

    Branch:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        centerName:
          type: string
        center:
          $ref: '#/components/schemas/Center'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/Section'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - centerName

    Section:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        branchName:
          type: string
        branchCenter:
          type: string
        branch:
          $ref: '#/components/schemas/Branch'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - branchName
        - branchCenter

    # ---- Location ----
    Base:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name

    Environment:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name

    Network:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name

    Location:
      type: object
      properties:
        id:
          type: integer
        baseName:
          type: string
        environmentName:
          type: string
        networkName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - baseName
        - environmentName
        - networkName

    # ---- Service ----
    Service:
      type: object
      properties:
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name

    Resource:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string
        serviceName:
          type: string
        service:
          $ref: '#/components/schemas/Service'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - unit
        - serviceName

    Capacity:
      type: object
      properties:
        id:
          type: integer
        locationId:
          type: integer
        resourceName:
          type: string
        resourceService:
          type: string
        value:
          type: number
          format: float
        allocated:
          type: number
          format: float
        available:
          type: number
          format: float
        location:
          $ref: '#/components/schemas/Location'
        resource:
          $ref: '#/components/schemas/Resource'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - locationId
        - resourceName
        - resourceService
        - value
        - allocated
        - available

    # ---- Request ----
    Project:
      type: object
      properties:
        name:
          type: string
        purpose:
          type: string
        type:
          $ref: '#/components/schemas/ProjectType'
        kind:
          $ref: '#/components/schemas/ProjectKind'
        locationId:
          type: integer
        location:
          $ref: '#/components/schemas/Location'
        year:
          type: integer
          nullable: true
        median:
          $ref: '#/components/schemas/Median'
        demands:
          type: array
          items:
            $ref: '#/components/schemas/Demand'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - purpose
        - type
        - kind
        - locationId

    Demand:
      type: object
      properties:
        id:
          type: integer
        projectName:
          type: string
        project:
          $ref: '#/components/schemas/Project'
        serviceName:
          type: string
        service:
          $ref: '#/components/schemas/Service'
        resourceName:
          type: string
        resourceService:
          type: string
        resource:
          $ref: '#/components/schemas/Resource'
        value:
          type: number
          format: float
        locationId:
          type: integer
        location:
          $ref: '#/components/schemas/Location'
        type:
          $ref: '#/components/schemas/DemandType'
        status:
          $ref: '#/components/schemas/DemandStatus'
        clusterName:
          type: string
          nullable: true
        approvedValue:
          type: number
          format: float
          nullable: true
        approvedDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - projectName
        - serviceName
        - resourceName
        - resourceService
        - value
        - locationId
        - type
        - status

    DecisionReason:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - displayName

    # ---- Request Bodies ----
    CreateDecisionReason:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
      required:
        - name
        - displayName

    UpdateDecisionReason:
      type: object
      properties:
        displayName:
          type: string
      required:
        - displayName
    CreateCenter:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
      required:
        - name

    CreateBranch:
      type: object
      properties:
        name:
          type: string
        centerName:
          type: string
        displayName:
          type: string
      required:
        - name
        - centerName

    UpdateBranch:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
      required:
        - name

    CreateSection:
      type: object
      properties:
        name:
          type: string
        branchName:
          type: string
        branchCenter:
          type: string
        displayName:
          type: string
      required:
        - name
        - branchName
        - branchCenter

    UpdateSection:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
      required:
        - name

    CreateLocation:
      type: object
      properties:
        baseName:
          type: string
        environmentName:
          type: string
        networkName:
          type: string
      required:
        - baseName
        - environmentName
        - networkName

    CreateResource:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string
        serviceName:
          type: string
      required:
        - name
        - unit
        - serviceName

    UpdateResource:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string

    CreateCapacity:
      type: object
      properties:
        locationId:
          type: integer
        resourceName:
          type: string
        resourceService:
          type: string
        value:
          type: number
          format: float
      required:
        - locationId
        - resourceName
        - resourceService
        - value

    UpdateCapacity:
      type: object
      properties:
        value:
          type: number
          format: float
      required:
        - value

    CreateProject:
      type: object
      properties:
        name:
          type: string
        purpose:
          type: string
        type:
          $ref: '#/components/schemas/ProjectType'
        kind:
          $ref: '#/components/schemas/ProjectKind'
        locationId:
          type: integer
        year:
          type: integer
        median:
          $ref: '#/components/schemas/Median'
      required:
        - name
        - purpose
        - type
        - kind
        - locationId

    UpdateProject:
      type: object
      properties:
        purpose:
          type: string
        type:
          $ref: '#/components/schemas/ProjectType'
        kind:
          $ref: '#/components/schemas/ProjectKind'
        locationId:
          type: integer
        year:
          type: integer
          nullable: true
        median:
          $ref: '#/components/schemas/Median'

    CreateDemand:
      type: object
      properties:
        projectName:
          type: string
        serviceName:
          type: string
        resourceName:
          type: string
        resourceService:
          type: string
        value:
          type: number
          format: float
        locationId:
          type: integer
        type:
          $ref: '#/components/schemas/DemandType'
        clusterName:
          type: string
      required:
        - projectName
        - serviceName
        - resourceName
        - resourceService
        - value
        - type

    UpdateDemand:
      type: object
      properties:
        serviceName:
          type: string
        resourceName:
          type: string
        resourceService:
          type: string
        value:
          type: number
          format: float
        locationId:
          type: integer
        type:
          $ref: '#/components/schemas/DemandType'
        clusterName:
          type: string

    ApproveDemand:
      type: object
      properties:
        status:
          type: string
          enum:
            - Approved
            - PartiallyApproved
        approvedValue:
          type: number
          format: float
      required:
        - status

# ============================================================
# Paths
# ============================================================

paths:
  # ----------------------------------------------------------
  # Root
  # ----------------------------------------------------------
  /:
    get:
      tags:
        - Root
      summary: API info
      responses:
        '200':
          description: API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /health:
    get:
      tags:
        - Root
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  # ----------------------------------------------------------
  # Auth
  # ----------------------------------------------------------
  /api/auth/token:
    post:
      tags:
        - Auth
      summary: Proxy OAuth token request
      description: Proxies the OAuth token request to the OIDC provider to avoid CORS issues.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  example: password
                client_id:
                  type: string
                client_secret:
                  type: string
                username:
                  type: string
                password:
                  type: string
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token response from OIDC provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '408':
          description: Request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Failed to obtain token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/health:
    get:
      tags:
        - Auth
      summary: OIDC and auth client health check
      responses:
        '200':
          description: Auth services are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthHealthResponse'
        '503':
          description: Auth services are degraded or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthHealthResponse'

  # ----------------------------------------------------------
  # Users & Groups
  # ----------------------------------------------------------
  /api/users-groups:
    get:
      tags:
        - Users & Groups
      summary: Search users and groups
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: true
          description: Search term (minimum 3 characters)
          schema:
            type: string
            minLength: 3
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersGroupsResult'
        '400':
          description: Search term too short
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------
  # Centers
  # ----------------------------------------------------------
  /api/centers:
    get:
      tags:
        - Centers
      summary: List all centers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of centers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Center'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Centers
      summary: Create a center
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCenter'
      responses:
        '201':
          description: Created center
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Center'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/centers/{name}:
    get:
      tags:
        - Centers
      summary: Get center by name
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Center found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Center'
        '404':
          description: Center not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Centers
      summary: Update a center
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCenter'
      responses:
        '200':
          description: Updated center
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Center'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Center not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Centers
      summary: Delete a center
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Center deleted
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Center not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------
  # Branches
  # ----------------------------------------------------------
  /api/branches:
    get:
      tags:
        - Branches
      summary: List all branches
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Branches
      summary: Create a branch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranch'
      responses:
        '201':
          description: Created branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/branches/center/{centerName}:
    get:
      tags:
        - Branches
      summary: List branches by center
      security:
        - BearerAuth: []
      parameters:
        - name: centerName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of branches for the center
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'

  /api/branches/{centerName}/{name}:
    get:
      tags:
        - Branches
      summary: Get branch by center and name
      security:
        - BearerAuth: []
      parameters:
        - name: centerName
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Branch found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404':
          description: Branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Branches
      summary: Update a branch
      security:
        - BearerAuth: []
      parameters:
        - name: centerName
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranch'
      responses:
        '200':
          description: Updated branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Branches
      summary: Delete a branch
      security:
        - BearerAuth: []
      parameters:
        - name: centerName
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Branch deleted
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ----------------------------------------------------------
  # Sections
  # ----------------------------------------------------------
  /api/sections:
    get:
      tags:
        - Sections
      summary: List all sections
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Section'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Sections
      summary: Create a section
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSection'
      responses:
        '201':
